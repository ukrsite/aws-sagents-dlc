[project]
name = "ai-dlc-agent"
version = "0.1.0"
description = "AWS Strands Agents prototype implementing the AI-Driven Development Life Cycle workflow"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.2.0",
    "strands-agents-evals>=0.2.0",
    "boto3>=1.34.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "bedrock-agentcore>=0.1.0",
    # llm-guard>=0.3.6  # disabled pending environment confirmation
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
